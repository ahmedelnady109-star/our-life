<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>حياتنا سوا ❤️</title>

<style>
body {
    text-align: center;
    font-family: Arial, sans-serif;
    background: #ffe6eb;
}

h1 {
    color: #e6005c;
    margin-top: 30px;
}

button {
    padding: 15px 25px;
    font-size: 20px;
    border: none;
    background: #ff4d88;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background: #e6005c;
}

#result {
    font-size: 24px;
    margin-top: 20px;
    color: #333;
}

img#myImage {
    display: block;
    margin: 20px auto;
    max-width: 300px;
    height: auto;
    border-radius: 15px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<h1>💖 اختارى حاجه يا ست البنات 💖</h1>

<button onclick="pick()">🎲 اختارى يلا</button>

<!-- الصورة اللي رفعتها -->
<img id="myImage" src="IMG_٢٠٢٥٠١٠٩_١٦٠١٠٧.jpg" alt="نشاطنا">

<p id="result"></p>

<!-- الصوت -->
<audio id="myAudio">
  <source src="sound.mp3" type="audio/mpeg">
</audio>

<script>
let list = [
"نروح دريم بارك",
"نروح الاهرامات",
"نروح المتحف المصري الكبير",
"نروح اسكندريه بقطر التالجو درجة الاولى",
"ناكل بليله عند حامد الاسكندرانى",
"ناكل كبده الفلاح",
"نروح برج القاهرة",
"مدينه التلج مول العرب",
"نلعب فى ماجيم بلانت",
"نأكل فى مطعم شجرة الدر",
"نعمل بلكونه حلوة ف شقتنا",
"نسافر جولة برا مصر",
"نعمل كعك وبسكوت مع بعض ف البيت",
"نعلق زينه رمضان سوا",
"نروح مع بعض داى يوز ف فندق",
"نعمل زينه رمضان سوا",
"نلعب بلاى ستيشن سوا",
"نركب الأتوبيس الدورين",
"نسمع ماتش الاهلي سوا",
"ناكل كسكسي عند مسجد عمرو بن العاص",
"ناكل سمين فى مسمط الشعب",
"ناكل في مطعم مهراجه الهندي قريب من كشري الغباشي مكرم عبيد",
"ناكل في اسماك بحري مكرم عبيد",
"نركب جمل",
"نركب خيل وحنتور",
"نركب المونوريل الجديد ف اول عربية قدام الشباك",
"نروح قلعة صلاح الدين",
"نعمل كامب سوا",
"نروح حديقه الازهر",
"ناكل سوشى",
"نتزحلق على الرملة ف الفيوم",
"ناكل مع بعض فسيخ وانا رنجه",
"نروح نوزع هدايا على اطفال ايتام او مرضى فى مستشفى او دار ايتام"
];

function pick() {
    // اختيار نشاط عشوائي
    let random = Math.floor(Math.random() * list.length);
    document.getElementById("result").innerText = list[random];

    // تشغيل الصوت
    let audio = document.getElementById("myAudio");
    audio.play();

    // لو عايز الصورة تتغير حسب النشاط، ممكن تعدل هنا
}
</script>

</body>
</html>
